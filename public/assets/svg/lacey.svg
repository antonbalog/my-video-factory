<svg xmlns="http://www.w3.org/2000/svg"
     width="400"
     height="400"
     viewBox="0 0 124 124"
     fill="none">
  <defs>
    <pattern id="chess-board"
             width="10"
             height="10"
             patternUnits="userSpaceOnUse">

      <!-- top-left -->
      <rect x="0" y="0" width="5" height="5" fill="#CCC"/>
      <!-- top-right -->
      <rect x="5" y="0" width="5" height="5" fill="#EEE"/>
      <!-- bottom-left -->
      <rect x="0" y="5" width="5" height="5" fill="#EEE"/>
      <!-- bottom-right -->
      <rect x="5" y="5" width="5" height="5" fill="#CCC"/>
    </pattern>
  </defs>

  <g stroke="#222"
     stroke-width="2"
     stroke-linejoin="round"
     stroke-linecap="round"
     transform="translate(-8 -8)"
    >
      <!-- Unfinished body -->
      <rect x="55" y="40" width="40" height="80" fill="url(#chess-board)" />
      <!-- Left eye -->
      <rect x="45" y="55" width="20" height="20" fill="#FFF" />
      <!-- Right eye -->
      <rect x="70" y="60" width="10" height="10" fill="#FFF" />
      <!-- Left eye pupil -->
      <rect x="60" y="65" width="2" height="2" fill="#222" />
      <!-- Right eye pupil -->
      <rect x="73" y="65" width="2" height="2" fill="#222" />
      <!-- Mouth -->
      <rect x="60" y="75" width="15" height="5" fill="#780606" />
    
  </g>
</svg>
